# Nächtliche Datensicherung (ADR 0009). Gehört als .github/workflows/backup.yml in das private
# Repository „familiar-backups“. Grundlage: Supabase-Doku „Automated backups using GitHub Actions“.
# Secrets (Repository › Settings › Secrets and variables › Actions):
#   SUPABASE_DB_URL       Session-Pooler-Verbindung des Produktionsprojekts (IPv4)
#   SUPABASE_URL          https://<projekt>.supabase.co
#   SUPABASE_SERVICE_KEY  Secret-Key (nur für das Herunterladen der Bilder)
# Verschlüsselt wird hybrid mit openssl (encrypt.sh): ein zufälliger Schlüssel je Archiv (AES-256),
# dieser wiederum mit dem öffentlichen RSA-Schlüssel `backup-public.pem` im Repository. Den privaten
# Schlüssel hat nur der Inhaber (Passwort-Manager). Ohne ihn ist die Sicherung nicht lesbar – auch
# nicht für GitHub. Entschlüsseln: decrypt.sh (siehe docs/setup/backup.md).
name: Datensicherung

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Datenbank sichern (Rollen, Schema, Daten)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          mkdir -p work
          supabase db dump --db-url "$SUPABASE_DB_URL" -f work/roles.sql --role-only
          supabase db dump --db-url "$SUPABASE_DB_URL" -f work/schema.sql
          supabase db dump --db-url "$SUPABASE_DB_URL" -f work/data.sql --data-only --use-copy

      - name: Datenbank verschlüsseln und ablegen
        run: |
          stamp=$(date -u +%Y-%m-%d)
          mkdir -p db
          tar -czf work/db.tar.gz -C work roles.sql schema.sql data.sql
          ./encrypt.sh work/db.tar.gz "db/familiar-db-$stamp"
          # Nur die letzten 60 Sicherungen behalten.
          ls -1d db/familiar-db-* | sort | head -n -60 | xargs -r git rm -rq
          git config user.name "Familiar Backup"
          git config user.email "backup@familiar-app.de"
          git add db
          git commit -m "Sicherung $stamp" && git push

      - name: Bilder sichern
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          node download-storage.mjs work/storage task-images avatars
          tar -czf work/images.tar.gz -C work storage
          ./encrypt.sh work/images.tar.gz familiar-bilder

      - uses: actions/upload-artifact@v4
        with:
          name: familiar-bilder
          path: familiar-bilder
          retention-days: 30
