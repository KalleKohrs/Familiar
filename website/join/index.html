<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Einladung zu Familiar</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="/assets/site.css">
</head>
<body>
  <main class="hero">
    <div class="card">
      <img class="mark" src="/assets/mark.svg" alt="">
      <h1>Du bist eingeladen</h1>
      <p>Jemand möchte dich in seine Familie bei Familiar holen.</p>
      <div class="code" id="code">–</div>
      <!-- Nach der Veröffentlichung: href auf den App-Store-Eintrag setzen. -->
      <a class="button" href="/">Familiar laden</a>
      <ol class="steps">
        <li>Familiar installieren und anmelden.</li>
        <li>Diesen Link noch einmal öffnen – oder in der App „Mit Code beitreten“ wählen und den Code eingeben.</li>
      </ol>
    </div>
  </main>
  <script>
    // Code aus /join/ABCD-EFGH lesen; nur Crockford-Base32 anzeigen.
    const raw = decodeURIComponent(location.pathname.split("/").filter(Boolean)[1] || "").toUpperCase().replace(/[\s-]/g, "");
    if (/^[0-9A-HJKMNP-TV-Z]{8}$/.test(raw)) {
      document.getElementById("code").textContent = raw.slice(0, 4) + "-" + raw.slice(4);
    }
  </script>
</body>
</html>
