<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Einladung zu Familiar</title>
  <meta name="robots" content="noindex">
  <style>
    :root { --canvas: #14100D; --card: #241E19; --text: #F6EEE6; --secondary: #BFB2A5; --accent: #FFA43A; --on-accent: #1B1006; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
           background: var(--canvas); color: var(--text);
           font: 17px/1.5 -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; }
    main { width: 100%; max-width: 420px; background: var(--card); border-radius: 24px; padding: 32px 24px; text-align: center; }
    h1 { font-size: 26px; margin: 0 0 8px; }
    p { color: var(--secondary); margin: 0 0 16px; }
    .code { font: 600 30px/1.2 ui-monospace, "SF Mono", Menlo, monospace; letter-spacing: 2px; color: var(--text);
            margin: 8px 0 24px; user-select: all; }
    a.button { display: block; background: var(--accent); color: var(--on-accent); text-decoration: none; font-weight: 600;
               border-radius: 16px; padding: 14px; margin-bottom: 12px; }
    ol { text-align: left; color: var(--secondary); padding-left: 20px; margin: 0; }
  </style>
</head>
<body>
  <main>
    <h1>Du bist eingeladen</h1>
    <p>Jemand möchte dich in seine Familie bei Familiar holen.</p>
    <div class="code" id="code">–</div>
    <!-- APP_STORE_URL nach der Veröffentlichung eintragen (App Store Connect › App-Informationen › Apple-ID). -->
    <a class="button" href="https://apps.apple.com/app/idAPP_STORE_ID">Familiar im App Store laden</a>
    <ol>
      <li>Familiar installieren und anmelden.</li>
      <li>Diesen Link noch einmal öffnen – oder in der App „Mit Code beitreten“ wählen und den Code eingeben.</li>
    </ol>
  </main>
  <script>
    // Code aus /join/ABCD-EFGH lesen; nur Crockford-Base32 anzeigen.
    const raw = decodeURIComponent(location.pathname.split("/").filter(Boolean)[1] || "").toUpperCase().replace(/[\s-]/g, "");
    if (/^[0-9A-HJKMNP-TV-Z]{8}$/.test(raw)) {
      document.getElementById("code").textContent = raw.slice(0, 4) + "-" + raw.slice(4);
    }
  </script>
</body>
</html>
